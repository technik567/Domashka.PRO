name: Tests and standalone build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements.txt
      - name: JavaScript tests
        run: npm test && npm run check:reference
      - name: Build the portable app
        run: npm run build:standalone
      - name: Python and distribution tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Ensure the downloadable HTML matches its sources
        run: git diff --exit-code -- Domashka_PRO.html USER_GUIDE.txt REFERENCE_COVERAGE.md
