name: Tests and standalone build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      public_smoke:
        description: 'Explicit opt-in: short anonymous Qwen3/Tavily live requests (uses free quota, no keys)'
        required: false
        type: boolean
        default: false
      legacy_smoke:
        description: 'Explicit synthetic Qwen/Pollinations check: at most 4 short requests, valid PNG, free streaming queue, no retries/keys/search'
        required: false
        type: boolean
        default: false
      pollinations_workflow:
        description: 'Explicit synthetic answer-or-search/review: at most 2 Pollinations streaming calls, no live search/Auth/photos/retries'
        required: false
        type: boolean
        default: false
      search_workflow:
        description: 'Explicit synthetic search regression: up to 2 Pollinations calls + 1 real keyless Tavily search, no Auth/photos/keys/retries'
        required: false
        type: boolean
        default: false
      network_metadata:
        description: 'Explicit read-only model/CORS diagnostics: GET metadata and OPTIONS, no inference, no Supabase'
        required: false
        type: boolean
        default: false
      public_report_run:
        description: 'Report-only: read a previous public-route-smoke artifact by run ID (no new provider calls)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements.txt
      - name: JavaScript tests
        run: npm test && npm run check:reference && npm run test:cloud
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check server-only Edge functions
        run: deno check --no-config --node-modules-dir=none --frozen --lock=supabase/functions/deno.lock supabase/functions/family-admin/index.ts supabase/functions/web-search/index.ts supabase/functions/account-access/index.ts
      - name: Build the portable app
        run: npm run build:standalone
      - name: Python and distribution tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate existing Worker package (dry run, never deploy)
        run: npm run check:worker
      - name: Ensure the downloadable HTML matches its sources
        run: git diff --exit-code -- Domashka_PRO.html USER_GUIDE.txt REFERENCE_COVERAGE.md

  public-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.public_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Explicit anonymous synthetic probes, no retries or personal keys
        run: |
          npx esbuild scripts/probe_public_routes.mjs --bundle --platform=node --format=esm --outfile=.cache/probe-public-routes.mjs
          node .cache/probe-public-routes.mjs --run-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-route-smoke
          path: .cache/public-smoke.json

  legacy-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.legacy_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Explicit synthetic legacy requests, never personal data or payment
        run: |
          npx esbuild scripts/probe_legacy_routes.mjs --bundle --platform=node --format=esm --outfile=.cache/probe-legacy-routes.mjs
          node .cache/probe-legacy-routes.mjs --run-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-route-report
          path: .cache/legacy-route-report.json

  pollinations-workflow:
    if: github.event_name == 'workflow_dispatch' && inputs.pollinations_workflow
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Synthetic initial answer and review, NO live search/Auth/retries
        run: |
          npx esbuild scripts/probe_legacy_routes.mjs --bundle --platform=node --format=esm --outfile=.cache/probe-legacy-routes.mjs
          node .cache/probe-legacy-routes.mjs --run-workflow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pollinations-workflow-report
          path: .cache/pollinations-workflow-report.json

  search-workflow:
    if: github.event_name == 'workflow_dispatch' && inputs.search_workflow
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: One synthetic search workflow, no accounts or refusal retries
        run: |
          npx esbuild scripts/probe_search_workflow.mjs --bundle --platform=node --format=esm --outfile=.cache/probe-search-workflow.mjs
          node .cache/probe-search-workflow.mjs --run-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-workflow-report
          path: .cache/search-workflow-report.json

  network-metadata:
    if: github.event_name == 'workflow_dispatch' && inputs.network_metadata
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read public API metadata and CORS headers (no inference or credentials)
        run: node scripts/probe_ai_network.mjs --run-metadata
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-network-metadata
          path: .cache/ai-network-report.json

  public-report:
    if: github.event_name == 'workflow_dispatch' && inputs.public_report_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - name: Read an existing report, without calling providers again
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_RUN: ${{ inputs.public_report_run }}
        run: |
          [[ "$REPORT_RUN" =~ ^[0-9]+$ ]]
          gh run download "$REPORT_RUN" --repo "$GITHUB_REPOSITORY" --name public-route-smoke --dir report
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('report/public-smoke.json').read_text())
          text = json.dumps(report, ensure_ascii=True).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=Existing public smoke report (no new provider calls)::' + text)
          PY
