project_id = "domashka-pro"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
# Local CLI development only. Set the real HTTPS Site URL and exact redirect
# allowlist in the hosted project's Auth settings before opening registration.
site_url = "http://localhost:5173"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[functions.family-admin]
# The function performs getUser() AND server-side session/family checks itself.
verify_jwt = false

[functions.web-search]
# Internal Auth.getUser plus service-only reservation RPC checks the real actor.
verify_jwt = false

[functions.account-access]
# Public endpoints verify CAPTCHA + atomic quotas; rotation verifies Auth/session/password.
verify_jwt = false
